name: quality
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: AegisPg2026Dev
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AEGIS_DB_DRIVER: postgres
      AEGIS_TEST_ADMIN_URL: postgresql://aegis:AegisPg2026Dev@127.0.0.1:5432/aegis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio ruff pytest-cov
      - name: Ruff lint
        run: cd backend && ruff check app ../tests --config ../ruff.toml
      - name: Ruff format check
        run: cd backend && ruff format --check app ../tests --config ../ruff.toml
      - name: Tests + coverage
        run: cd backend && PYTHONPATH=. python -m pytest ../tests -q --cov=app --cov-report=term --cov-fail-under=50
