name: Build & Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: AegisPg2026Dev
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AEGIS_DB_DRIVER: postgres
      AEGIS_TEST_ADMIN_URL: postgresql://aegis:AegisPg2026Dev@127.0.0.1:5432/aegis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: pytest -q
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t aegis-platform:test .
      - name: Smoke test container
        run: |
          docker run -d --name aegis-test \
            -e AEGIS_OWNER_TOKEN=test-token-ci \
            -e AEGIS_DATA_DIR=/tmp/aegis-ci \
            -e OPENROUTER_KEYS= \
            -p 8000:8000 aegis-platform:test
          sleep 15
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/ready
