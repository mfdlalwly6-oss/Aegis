# AEGIS code quality — ruff (lint + format check)
target-version = "py311"
line-length = 110

[lint]
# pragmatic baseline for a financial platform: errors, imports, naming, security-adjacent
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM"]
ignore = [
    "S101",    # asserts allowed in tests
    "E501",    # line length handled by formatter config
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "S110",    # intentional silent-fallback parsing (JSON repair chain in fraud_agent)
    "S112",    # intentional continue-on-skip in batch loops (documented per-site)
    "UP042",   # str-Enum pattern kept for SQLite/PG dual-driver compatibility
    "SIM105",  # small explicit try/except kept for readability over contextlib.suppress
    "B904",    # raise-without-from in API handlers: HTTPException carries no cause by design
    "S105",    # test/dev placeholder tokens only (real secrets come from env, never hardcoded)
    "S108",    # /tmp paths are container-scoped test fixtures
    "N803",    # FastAPI path params (camelCase legacy route args kept for API stability)
    "N806",    # local var naming in legacy webhook parser (kept for readability)
    "E741",    # short loop var in packed aggregation loop
    "SIM102",  # nested-if kept where guard clauses would obscure business rules
    "SIM108",  # ternary readability is subjective in dense rule-eval code
    "C416",    # comprehension kept for clarity in a hot path
    "E402",    # json import after code block in tests (test-only ordering)
]

[lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[format]
quote-style = "double"
