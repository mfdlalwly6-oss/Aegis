[tool.poetry]
name = "aegis-backend"
version = "2.0.0"
description = "AEGIS — Multi-tenant Financial Fraud Detection Platform"
authors = ["AEGIS Engineering <eng@aegis-security.io>"]
license = "Apache-2.0"
readme = "../README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
httpx = "^0.27.2"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
prometheus-client = "^0.21.0"
structlog = "^24.4.0"
pyyaml = "^6.0.2"
numpy = "^1.26.4"
scikit-learn = "^1.5.2"
networkx = "^3.3"
joblib = "^1.4.2"
tenacity = "^9.0.0"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.managers.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]
