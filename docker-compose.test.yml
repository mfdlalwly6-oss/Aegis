# Test runner — runs the full pytest suite against an ISOLATED PostgreSQL
# test database (`aegis_test`) created from real migrations, never the live
# `aegis` database. conftest.py hard-fails if the URL does not target
# aegis_test. No SQLite path exists.
# DEF-03: explicit project name prevents this stack from ever touching the
# production stack (default project name is derived from the directory and
# would collide with prod, making compose stop prod as orphans).
name: aegis-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-test-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: AegisPg2026Dev
      POSTGRES_DB: aegis
    volumes:
      - pg-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  aegis-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: aegis-aegis
    working_dir: /app
    environment:
      AEGIS_DB_DRIVER: postgres
      AEGIS_TEST_ADMIN_URL: postgresql://aegis:AegisPg2026Dev@postgres:5432/aegis
      AEGIS_ENV: development
    volumes:
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./ruff.toml:/app/ruff.toml:ro
      - ./backend/requirements-dev.txt:/app/requirements-dev.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pip install -q -r /app/requirements-dev.txt && python -m pytest /app/tests -q"]

volumes:
  pg-test-data:

networks:
  default:
    driver: bridge
