services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AegisPg2026Dev}
      POSTGRES_DB: aegis
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aegis:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aegis-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AEGIS_DATA_DIR: /data
      AEGIS_DB_PATH: /data/aegis.db
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - aegis-data:/data
    networks:
      - aegis-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  aegis-data:
  pg-data:

networks:
  aegis-net:
    driver: bridge
